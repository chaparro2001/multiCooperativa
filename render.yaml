# Render Blueprint for the hosted demo (docs/04-deployment.md).
# Free plan, no credit card. Secrets are NOT stored here: `sync: false` makes Render ask for
# them in the dashboard the first time the blueprint is applied.
services:
  - type: web
    name: multicooperativa-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    # The build context is the repository root (pnpm workspace).
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Must not touch the database: keep-alive pings would otherwise wake Neon.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Database (Neon): pooled URL for the API, direct URL for `prisma migrate deploy` at start.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Signing secret of the access tokens (min. 32 chars); Render generates it.
      - key: JWT_SECRET
        generateValue: true
      # Files (Supabase Storage through its S3 protocol).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: multicooperativa
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      # Language model, vision and embeddings (Gemini; ADR-009, ADR-010).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # Free-tier models tried in order when GEMINI_MODEL keeps answering 503/429 (ADR-009).
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: EMBEDDINGS_PROVIDER
        value: gemini
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: ASSISTANT_MESSAGE_LIMIT_PER_HOUR
        value: '30'
      # Browser origins allowed by CORS: the GitHub Pages site (origin only, no path).
      - key: CORS_ORIGINS
        value: https://chaparro2001.github.io
      # Bearer secret of POST /jobs/due-dates; the same value goes in the GitHub secret JOBS_TOKEN.
      - key: JOBS_TOKEN
        sync: false
