# Infraestructura local de desarrollo. Las credenciales son solo para el entorno local.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: multicooperativa
      POSTGRES_PASSWORD: multicooperativa
      POSTGRES_DB: multicooperativa
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U multicooperativa -d multicooperativa']
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento compatible con S3 (ADR-005). Consola web en http://localhost:9001.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: multicooperativa
      RUSTFS_SECRET_KEY: multicooperativa-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
