# Local development infrastructure. The credentials are for the local environment only.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: multicooperativa
      POSTGRES_PASSWORD: multicooperativa
      POSTGRES_DB: multicooperativa
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U multicooperativa -d multicooperativa']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage (ADR-005). Web console at http://localhost:9001.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: multicooperativa
      RUSTFS_SECRET_KEY: multicooperativa-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data

  # Embeddings with a local model (ADR-006). The model is downloaded with `pnpm ai:pull`.
  ollama:
    image: ollama/ollama:0.35.1
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  storage-data:
  ollama-data:
