name: Deploy web demo

# Expo web export hosted on GitHub Pages (docs/04-deployment.md).
# Repository variable required: API_URL (the public API URL, no trailing slash).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the API URL
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Export for the web
        working-directory: apps/mobile
        env:
          # Inlined into the bundle at build time; it is public by design.
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
        run: pnpm exec expo export --platform web --output-dir dist

      # Served at the root of cooperativa.chaparro2001.com (ADR-017). Pages answers unknown paths with
      # 404.html: serving the app there keeps deep links working.
      - name: SPA fallback and no Jekyll
        working-directory: apps/mobile/dist
        run: |
          cp index.html 404.html
          touch .nojekyll
          # Custom domain (ADR-017); also kept in Settings > Pages. Harmless with Actions deploys.
          echo cooperativa.chaparro2001.com > CNAME

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/mobile/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
