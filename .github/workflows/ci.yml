name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck y tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: multicooperativa
          POSTGRES_PASSWORD: multicooperativa
          POSTGRES_DB: multicooperativa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multicooperativa -d multicooperativa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Credenciales efímeras del contenedor de servicio de este job.
      DATABASE_URL: postgresql://multicooperativa:multicooperativa@localhost:5432/multicooperativa
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Migraciones
        run: pnpm --filter @multicooperativa/api db:deploy

      - name: Tests de integración
        run: pnpm test:integration
