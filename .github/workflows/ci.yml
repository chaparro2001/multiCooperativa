name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: multicooperativa
          POSTGRES_PASSWORD: multicooperativa
          POSTGRES_DB: multicooperativa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multicooperativa -d multicooperativa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # S3-compatible storage for the integration tests (ADR-005).
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: multicooperativa
          RUSTFS_SECRET_KEY: multicooperativa-dev
        ports:
          - 9000:9000
    env:
      # Ephemeral credentials of this job's service container.
      DATABASE_URL: postgresql://multicooperativa:multicooperativa@localhost:5432/multicooperativa
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Migrations
        run: pnpm --filter @multicooperativa/api db:deploy

      - name: Integration tests
        run: pnpm test:integration
