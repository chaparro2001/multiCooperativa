name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: multicooperativa
          POSTGRES_PASSWORD: multicooperativa
          POSTGRES_DB: multicooperativa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multicooperativa -d multicooperativa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # S3-compatible storage for the integration tests (ADR-005).
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: multicooperativa
          RUSTFS_SECRET_KEY: multicooperativa-dev
        ports:
          - 9000:9000
    env:
      # Ephemeral credentials of this job's service container.
      DATABASE_URL: postgresql://multicooperativa:multicooperativa@localhost:5432/multicooperativa
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Informative only: the known advisories are documented in docs/04-deployment.md.
      - name: Dependency audit (non-blocking)
        run: pnpm audit --prod --audit-level high || true

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Migrations
        run: pnpm --filter @multicooperativa/api db:deploy

      - name: Integration tests
        run: pnpm test:integration

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the API image (not pushed)
        run: docker build -f apps/api/Dockerfile -t multicooperativa-api:ci .
